# Builds the page from main and the `data` branch and publishes it on GitHub
# Pages. Called by `probe` and run on every push to main (incidents, texts, code).
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s status -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Latest data
        run: |
          git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" data-branch || mkdir -p data-branch
          git clone -q --depth 1 --branch security-data "https://github.com/${{ github.repository }}.git" security-data || mkdir -p security-data
      - run: python3 status/build.py --services services.toml --data data-branch --out _site --security security-data
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
